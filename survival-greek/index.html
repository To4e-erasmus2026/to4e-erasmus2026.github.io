<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="description" content="Survival Greek: a pocket phrasebook for Erasmus+ Together for Equality guests at 1o GEL Neas Makris.">
<title>Survival Greek</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Commissioner:wght@400;500;600;700;800;900&display=swap">
<style>
/* Layout: sea-blue app header + scrolling tab row, sand "sheet" of phrase cards, one group at a time. Single bright look by choice. */
:root {
  --sea: #0A6A9B;
  --deep: #073B5A;
  --sun: #FFC83D;
  --sand: #F7F4EC;
  --card: #FFFFFF;
  --ink: #1C2B36;
  --muted: #3D4C59;
  --chip: #E3F0F6;
  --chipText: #0A5C8A;
  --line: #E2DCCB;
  --onSea: #FFFFFF;
  --font: 'Commissioner', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
  color-scheme: light;
}
html, body { background: var(--sea); }
body { color: var(--ink); font-family: var(--font); font-size: 16px; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 560px; margin: 0 auto; }

header { color: var(--onSea); padding: 24px 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.eyebrow { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 12px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; }
.eyebrow .place { letter-spacing: 0.04em; text-transform: none; padding: 4px 8px; border-radius: 8px; background: rgba(255,255,255,0.16); }
h1 { margin: 10px 0 0; display: flex; flex-direction: column; text-wrap: balance; }
h1 .en { font-size: 32px; font-weight: 900; line-height: 1.05; letter-spacing: -0.02em; }
h1 .gr { font-size: 42px; font-weight: 900; line-height: 1.1; letter-spacing: -0.02em; color: var(--sun); }
.sub { margin: 8px 0 0; font-size: 15px; line-height: 1.45; max-width: 34ch; }
.key { display: block; width: 100%; height: 14px; }

nav { display: flex; gap: 8px; overflow-x: auto; padding: 14px 20px 18px; scrollbar-width: none; }
nav::-webkit-scrollbar { display: none; }
nav button { flex: none; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 1.5px solid rgba(255,255,255,0.5); background: transparent; color: var(--onSea); font: 700 14px/1 var(--font); white-space: nowrap; cursor: pointer; }
nav button[aria-pressed="true"] { background: var(--sun); border-color: var(--sun); color: var(--deep); font-weight: 800; }
nav button:focus-visible, .next:focus-visible, .why:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }

main { background: var(--sand); border-radius: 28px 28px 0 0; padding: 22px 16px 32px; display: flex; flex-direction: column; gap: 12px; min-height: 60vh; }

.warn { background: var(--sun); color: var(--ink); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px; transform: rotate(-1deg); }
.warn .label { font-size: 13px; font-weight: 900; letter-spacing: 0.12em; text-transform: uppercase; color: var(--deep); }
.warn .yesno { display: flex; flex-wrap: wrap; gap: 6px 20px; font-size: 26px; font-weight: 900; color: var(--deep); }
.warn p { margin: 0; font-size: 15px; line-height: 1.5; }

.ghead { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; flex-wrap: wrap; padding: 6px 4px 0; }
.ghead h2 { margin: 0; font-size: 22px; font-weight: 900; color: var(--deep); text-wrap: balance; }
.ghead span { font-size: 15px; font-weight: 700; color: var(--chipText); }

.card { background: var(--card); border-radius: 20px; padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; box-shadow: 0 1px 0 var(--line); }
.card .gr { font-size: 32px; font-weight: 800; line-height: 1.12; letter-spacing: -0.01em; color: var(--deep); overflow-wrap: anywhere; }
.card .en { font-size: 15px; line-height: 1.35; color: var(--muted); }
.card .pr { align-self: flex-start; margin-top: 2px; padding: 5px 10px; border-radius: 10px; background: var(--chip); color: var(--chipText); font-size: 16px; font-weight: 600; line-height: 1.5; }
.card .pr b { background: var(--sun); color: var(--deep); border-radius: 4px; padding: 0 3px; font-weight: 900; }
.card .note { align-self: flex-start; margin-top: 4px; padding: 6px 10px; border-radius: 10px; background: var(--deep); color: var(--onSea); font-size: 14px; font-weight: 600; line-height: 1.4; }

.next { min-height: 48px; margin-top: 4px; border: 2px solid var(--deep); border-radius: 24px; background: transparent; color: var(--deep); font: 800 15px/1.2 var(--font); cursor: pointer; padding: 0 16px; }

footer { margin-top: 14px; padding: 18px; border-radius: 20px; background: var(--deep); color: var(--onSea); display: flex; flex-direction: column; gap: 10px; }
footer p { margin: 0; font-size: 14px; line-height: 1.5; }
footer .ref { font-size: 12px; color: #C9DCE6; }
@media (prefers-reduced-motion: reduce) { .warn { transform: none; } }
</style>
<style>body{margin:0}*{box-sizing:border-box}</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="eyebrow"><span>Erasmus+ · Together for Equality</span><span class="place" lang="el">Νέα Μάκρη</span></div>
    <h1><span class="en">Survival Greek</span><span class="gr" lang="el">Καλώς ήρθατε!</span></h1>
    <p class="sub">Welcome to Greece! Here are the words you'll hear every day this week.</p>
  </header>
  <canvas class="key" id="key" aria-hidden="true"></canvas>
  <nav id="tabs" aria-label="Phrase groups"></nav>
  <main id="main" aria-live="polite"></main>
</div>

<script>
var GROUPS = [
  { id: 'hello', tab: 'Hello & bye', en: 'Hello & goodbye', el: 'Χαιρετισμοί', phrases: [
    ['Γεια σου', 'Hello / Bye (friendly)', 'YA su'],
    ['Γεια σας', 'Hello (polite / to a group)', 'YA sas'],
    ['Καλημέρα', 'Good morning', 'ka-li-ME-ra'],
    ['Καλησπέρα', 'Good evening', 'ka-li-SPE-ra'],
    ['Καληνύχτα', 'Good night', 'ka-li-NIH-ta'],
    ['Καλώς ήρθατε!', 'Welcome!', 'ka-LOS IR-tha-te']
  ]},
  { id: 'polite', tab: 'Being polite', en: 'Being polite', el: 'Ευγένεια', phrases: [
    ['Ευχαριστώ', 'Thank you', 'ef-ha-ri-STO'],
    ['Παρακαλώ', 'Please / You’re welcome', 'pa-ra-ka-LO'],
    ['Ναι', 'Yes', 'ne'],
    ['Όχι', 'No', 'O-hi'],
    ['Συγγνώμη', 'Sorry / Excuse me', 'si-GHNO-mi'],
    ['Χάρηκα', 'Nice to meet you', 'HA-ri-ka']
  ]},
  { id: 'meet', tab: 'Getting to know', en: 'Getting to know each other', el: 'Γνωριμία', phrases: [
    ['Με λένε…', 'My name is…', 'me LE-ne'],
    ['Πώς σε λένε;', 'What’s your name?', 'pos se LE-ne?', 'Tip: the Greek question mark looks like ;'],
    ['Είμαι από…', 'I am from…', 'I-me a-PO'],
    ['Τι κάνεις;', 'How are you?', 'ti KA-nis?'],
    ['Καλά, ευχαριστώ', 'Fine, thanks', 'ka-LA, ef-ha-ri-STO'],
    ['Φίλος / Φίλη', 'Friend (male / female)', 'FI-los (m) / FI-li (f)']
  ]},
  { id: 'food', tab: 'Food & café', en: 'Food & café', el: 'Φαγητό & καφές', phrases: [
    ['Νερό', 'Water', 'ne-RO'],
    ['Γεια μας!', 'Cheers!', 'YA mas!'],
    ['Νόστιμο!', 'Delicious!', 'NO-sti-mo!'],
    ['Τον λογαριασμό, παρακαλώ', 'The bill, please', 'ton lo-ghar-ya-ZMO, pa-ra-ka-LO'],
    ['Πόσο κάνει;', 'How much is it?', 'PO-so KA-ni?'],
    ['Καλή όρεξη', 'Enjoy your meal', 'ka-LI O-rek-si']
  ]},
  { id: 'around', tab: 'Getting around', en: 'Getting around', el: 'Μετακινήσεις', phrases: [
    ['Πού είναι…;', 'Where is…?', 'pu I-ne?'],
    ['Τουαλέτα', 'Toilet', 'tu-a-LE-ta'],
    ['Παραλία', 'Beach', 'pa-ra-LI-a'],
    ['Πάμε!', 'Let’s go!', 'PA-me!'],
    ['Δεν καταλαβαίνω', 'I don’t understand', 'dhen ka-ta-la-VE-no'],
    ['Βοήθεια!', 'Help!', 'vo-I-thi-a!', 'Emergency number: 112']
  ]},
  { id: 'week', tab: 'Our week', en: 'The week together', el: 'Η εβδομάδα μας', phrases: [
    ['Ισότητα', 'Equality', 'i-SO-ti-ta'],
    ['Μαζί', 'Together', 'ma-ZI'],
    ['Μπράβο!', 'Well done!', 'BRA-vo!'],
    ['Ώπα!', 'Hurray! / Oops!', 'O-pa!'],
    ['Τα λέμε αύριο', 'See you tomorrow', 'ta LE-me AV-ri-o'],
    ['Καλό ταξίδι!', 'Have a good trip!', 'ka-LO tak-SI-dhi!']
  ]}
];

function esc(s) { return s.replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
function pron(s) {
  return s.split(/([\s\-,?!()\/]+)/).map(function (t) {
    if (!t) return '';
    return (/[A-Z]/.test(t) && t === t.toUpperCase()) ? '<b>' + esc(t) + '</b>' : esc(t);
  }).join('');
}

var tabsEl = document.getElementById('tabs');
var mainEl = document.getElementById('main');
var current = 0;

function render(i, scroll) {
  current = i;
  try { localStorage.setItem('sg-tab', String(i)); } catch (e) {}
  Array.prototype.forEach.call(tabsEl.children, function (b, j) { b.setAttribute('aria-pressed', j === i ? 'true' : 'false'); });
  var g = GROUPS[i];
  var html = '';
  if (i < 2) {
    html += '<div class="warn"><span class="label">Careful!</span>' +
      '<div class="yesno"><span><span lang="el">ναι</span> = YES</span><span><span lang="el">όχι</span> = NO</span></div>' +
      '<p><b lang="el">ναι</b> (ne) means YES. ‘No’ is <b lang="el">όχι</b> (O-hi). Greeks often say no by lifting the head and eyebrows up, sometimes with a little ‘tsk’.</p></div>';
  }
  html += '<div class="ghead"><h2>' + esc(g.en) + '</h2><span lang="el">' + esc(g.el) + '</span></div>';
  g.phrases.forEach(function (p) {
    html += '<div class="card"><span class="gr" lang="el">' + esc(p[0]) + '</span><span class="en">' + esc(p[1]) + '</span>' +
      '<span class="pr">' + pron(p[2]) + '</span>' + (p[3] ? '<span class="note">' + esc(p[3]) + '</span>' : '') + '</div>';
  });
  if (i < GROUPS.length - 1) html += '<button class="next" type="button" id="next">Next: ' + esc(GROUPS[i + 1].en) + ' →</button>';
  html += '<footer><p><b lang="el">1ο ΓΕΛ Νέας Μάκρης</b> welcomes our partners to Greece · Erasmus+ Together for Equality</p>' +
    '<p class="ref">Co-funded by the European Union · Project ref. 2025-1-RO01-KA220-SCH-000362818</p></footer>';
  mainEl.innerHTML = html;
  var nx = document.getElementById('next');
  if (nx) nx.addEventListener('click', function () { render(current + 1, true); });
  if (scroll) tabsEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
  var active = tabsEl.children[i];
  if (active && active.scrollIntoView) active.scrollIntoView({ inline: 'center', block: 'nearest' });
}

GROUPS.forEach(function (g, i) {
  var b = document.createElement('button');
  b.type = 'button';
  b.textContent = g.tab;
  b.addEventListener('click', function () { render(i, false); });
  tabsEl.appendChild(b);
});

var start = 0;
var hash = (location.hash || '').slice(1);
GROUPS.forEach(function (g, i) { if (g.id === hash) start = i; });
if (!hash) { try { var s = parseInt(localStorage.getItem('sg-tab'), 10); if (s >= 0 && s < GROUPS.length) start = s; } catch (e) {} }
render(start, false);
window.scrollTo(0, 0);

// Greek key border, drawn to the page width
function drawKey() {
  var c = document.getElementById('key');
  var w = c.clientWidth, h = 14, dpr = window.devicePixelRatio || 1;
  c.width = w * dpr; c.height = h * dpr;
  var x = c.getContext('2d');
  x.scale(dpr, dpr);
  x.strokeStyle = 'rgba(255,200,61,0.75)';
  x.lineWidth = 1.5;
  x.beginPath();
  x.moveTo(0, 13); x.lineTo(w, 13);
  for (var s = 2; s + 11 < w; s += 16) {
    x.moveTo(s, 13); x.lineTo(s, 2); x.lineTo(s + 11, 2); x.lineTo(s + 11, 10); x.lineTo(s + 4, 10); x.lineTo(s + 4, 6); x.lineTo(s + 7, 6);
  }
  x.stroke();
}
drawKey();
window.addEventListener('resize', drawKey);
</script>
</body>
</html>
